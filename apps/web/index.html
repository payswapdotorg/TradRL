<!doctype html>
<!--
  @tradrl/web-console — THE STATIC SHELL (Work Order T042).

  A zero-dependency, no-build static page: no framework, no CDN, no
  external assets, no bundler. The shell carries three things:

    1. the app root (#tradrl-console) the console mounts into;
    2. the console's configuration (window.__TRADRL_CONSOLE__ — the
       host injects the credential token and the tenant/project scope
       at the secure boundary when it serves this page);
    3. the no-build loader bootstrap: a tiny inline script that loads
       the TS entry (src/index.ts -> the package main) through the
       erasable-type loader (src/loader/strip-types.ts) as a browser
       module — no compilation step, ever.

  Graceful degradation is the contract: if anything at all fails —
  no root, no token, an unreachable API, a loader failure — the page
  renders a readable message inside #tradrl-console. Never blank,
  never a crash. See apps/web/README.md for the full loader contract.

  THE LAW (Work Order T042): "A static shell: index.html at the
  package root plus a documented no-build loader (the app boots from
  the TS entry via the package main; no bundler, no framework, no
  runtime dependency — DOM APIs only; graceful degradation when the
  API is unreachable)."
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradRL Console</title>
  <style>
    /* Hand-authored, minimal, dependency-free: legibility only. */
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; }
    #tradrl-console { padding: 1rem; }
    .console-boot-message { color: #a33; font-weight: 600; }
    .console { display: grid; gap: 1rem; }
    .console-header h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    .console-body { display: grid; grid-template-columns: 13rem 1fr; gap: 1rem; }
    @media (max-width: 48rem) { .console-body { grid-template-columns: 1fr; } }
    .console-main { display: grid; gap: 1rem; }
    .panel { display: grid; gap: .75rem; }
    .card { border: 1px solid #8884; border-radius: .5rem; padding: .75rem; display: grid; gap: .5rem; }
    .card-title { font-weight: 700; }
    .badge { border-radius: 999px; padding: .05rem .6rem; font-size: .85rem; border: 1px solid #8886; width: fit-content; }
    .fact { display: grid; grid-template-columns: 11rem 1fr; gap: .5rem; }
    .fact-label { color: #888; }
    .empty { color: #888; font-style: italic; }
    .hint { color: #888; font-size: .9rem; }
    .connection { font-size: .9rem; }
    .progress { background: #8883; border-radius: 999px; overflow: hidden; }
    .progress-fill { display: block; height: .5rem; background: #48c; }
    .console-nav { display: grid; gap: .25rem; align-content: start; }
    .console-nav button { all: unset; cursor: pointer; padding: .25rem .5rem; border-radius: .375rem; }
    .console-nav button[aria-current="true"] { background: #48c3; font-weight: 600; }
    .error-card { border-color: #a336; }
    .watch { display: grid; gap: .5rem; }
    .inbox { display: grid; gap: .5rem; align-content: start; }
    .notice { border-left: 3px solid #48c; padding-left: .5rem; }
    .notice[data-read="true"] { opacity: .55; }
  </style>
</head>
<body>
  <noscript>
    <p>The TradRL Console is a JavaScript application and cannot run
    with scripting disabled. Enable JavaScript and reload this page.</p>
  </noscript>

  <!-- THE APP ROOT: the console mounts its render tree here. -->
  <div id="tradrl-console">
    <p class="console-boot-message" data-boot="pending">Loading the TradRL Console&hellip;</p>
  </div>

  <!--
    THE CONSOLE'S CONFIGURATION: the host that serves this page
    substitutes real values here (the credential token is minted at
    the secure boundary; it is NEVER baked into the repository).
    Defaults below are for local development against a same-origin
    API on localhost.
  -->
  <script>
    window.__TRADRL_CONSOLE__ = {
      apiOrigin: 'http://localhost:8787',
      token: '',
      tenantId: '',
      projectId: ''
    };
  </script>

  <!--
    THE NO-BUILD LOADER BOOTSTRAP (~40 lines, inline by design):
    fetch the package main (src/index.ts) and the loader
    (src/loader/strip-types.ts) as text, strip the loader with the
    micro-style regex pass (the loader file is written in the
    restricted self-hosting subset — see its header), import it as a
    blob module, then use ITS full tokenizer-based stripper to load
    the entry. Every failure degrades to a message in the root.

    No bundler. No CDN. No external assets. DOM + fetch only.
  -->
  <script type="module">
    (async () => {
      const root = document.getElementById('tradrl-console');
      const fail = (message, detail) => {
        if (root === null) { console.error(message, detail ?? ''); return; }
        root.textContent = '';
        const p = document.createElement('p');
        p.className = 'console-boot-message';
        p.setAttribute('data-boot', 'degraded');
        p.textContent = detail === undefined ? message : message + ' \u2014 ' + detail;
        root.appendChild(p);
      };
      try {
        // 1. Load the loader source and strip it with the micro-style
        //    regex pass (self-hosting bootstrap; the equivalence with
        //    the full stripper is pinned by a test).
        const loaderResponse = await fetch('./src/loader/strip-types.ts');
        if (loaderResponse.ok !== true) throw new Error('fetch ./src/loader/strip-types.ts -> ' + loaderResponse.status);
        const loaderSource = await loaderResponse.text();
        const stripped = loaderSource
          .replace(/\/\*[\s\S]*?\*\//g, '')
          .replace(/(^|\n)[ \t]*\/\/[^\n]*/g, '$1')
          .replace(/(^|\n)[ \t]*(?:export\s+)?interface\s+[A-Za-z0-9_$]+[\s\S]*?\n\}/g, '$1')
          .replace(/(^|\n)[ \t]*(?:export\s+)?type\s+[^\n=]*=[^\n]*\n/g, '$1')
          .replace(/(?<![A-Za-z0-9_$])(:[ \t]*(?:readonly[ \t]+)?[A-Za-z_$][A-Za-z0-9_$]*(?:\[\])?(?:[ \t]*\|[ \t]*[A-Za-z_$][A-Za-z0-9_$]*(?:\[\])?)*(?:[ \t]*\[\])?[ \t]*)(?=[,)=;]|\n)/g, '');
        const loaderUrl = URL.createObjectURL(new Blob([stripped], { type: 'text/javascript' }));
        const loader = await import(loaderUrl);

        // 2. Load the whole console module graph through the loader,
        //    landing the app module for the entry's boot path.
        const app = await loader.loadModuleGraph('./src/app/console.ts', {
          readModule: async (path) => {
            const response = await fetch(path);
            if (response.ok !== true) throw new Error('fetch ' + path + ' -> ' + response.status);
            return await response.text();
          },
          createModuleUrl: async (code) => URL.createObjectURL(new Blob([code], { type: 'text/javascript' })),
          importModule: async (url) => await import(url)
        });
        window.__TRADRL_CONSOLE_BOOT__ = app;

        // 3. Load the package main itself through the loader (the
        //    documented boot path: the app boots from the TS entry
        //    via the package main), which auto-boots into the root.
        await loader.loadModuleGraph('./src/index.ts', {
          readModule: async (path) => {
            const response = await fetch(path);
            if (response.ok !== true) throw new Error('fetch ' + path + ' -> ' + response.status);
            return await response.text();
          },
          createModuleUrl: async (code) => URL.createObjectURL(new Blob([code], { type: 'text/javascript' })),
          importModule: async (url) => await import(url)
        });
      } catch (error) {
        fail('The console could not start', (error && error.message) ? error.message : String(error));
      }
    })();
  </script>
</body>
</html>
