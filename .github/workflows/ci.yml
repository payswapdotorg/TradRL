name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify (typecheck, tests, program state, governance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm program:check
      - run: pnpm governance:test
